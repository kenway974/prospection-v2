name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qualite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: 1. Installation reproductible
        run: uv sync --frozen
      - name: 2. Audit des dépendances
        run: |
          uv export --frozen --no-dev --no-emit-project -q > requirements-prod.txt
          uv run pip-audit -r requirements-prod.txt --disable-pip --no-deps --strict
      - name: 3. Lint, couches et taille des fichiers
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run lint-imports
          uv run python scripts/check_file_size.py src tests
      - name: 4. Types
        run: uv run mypy
      - name: 5. Tests (fuseau éloigné d'UTC) et couverture
        env:
          TZ: America/Los_Angeles
        run: |
          # Chromium (C166), téléchargé chez Playwright. Ses bibliothèques système sont déjà sur
          # les machines de GitHub (Google Chrome y est installé) : pas de passage par les
          # miroirs Ubuntu, injoignables depuis GitHub le 11/11.
          uv run playwright install chromium
          uv run pytest --cov --cov-report=term --cov-fail-under=80
          uv run coverage report --include='src/prospection/domain/*' --fail-under=90
      - name: 6. Image de production
        run: docker build -t prospection:ci .
      - name: 7. Bout en bout sur l'image
        run: |
          docker run --network host -e PGPASSWORD=postgres postgres:16 \
            psql -h localhost -U postgres -c 'CREATE DATABASE prospection_e2e'
          HASH=$(uv run python -c "from prospection.application.password import hash_password; print(hash_password('mot de passe e2e'))")
          {
            echo "DATABASE_URL=postgresql+psycopg://postgres:postgres@localhost:5432/prospection_e2e"
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "APP_PASSWORD_HASH=$HASH"
            echo "ENCRYPTION_KEY=$(uv run python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")"
            echo "BEHIND_PROXY=false"
          } > e2e.env
          docker run -d --name app --network host -e PORT=8077 --env-file e2e.env prospection:ci
          curl -sf --retry 30 --retry-delay 1 --retry-all-errors localhost:8077/sante \
            || { echo "L'app n'a pas démarré"; exit 1; }
          # Tâche de fond, une fois les migrations faites, branchée sur le faux Google local
          # Python du projet, pas « uv run » : un uv resté en tâche de fond bloque le cache
          .venv/bin/python -m tests.e2e.fake_google 8099 &
          FAKE_GOOGLE=$!
          docker run -d --name worker --network host --env-file e2e.env \
            -e TEST_SERVICES_URL=http://127.0.0.1:8099 prospection:ci python -m prospection.worker
          uv run playwright install chromium
          E2E_BASE_URL=http://localhost:8077 E2E_PASSWORD='mot de passe e2e' uv run pytest -m e2e
          kill $FAKE_GOOGLE
      - name: Journaux de l'app en cas d'échec
        if: failure()
        run: '{ docker logs app; docker logs worker; } || true'
