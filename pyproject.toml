[project]
name = "prospection"
version = "0.1.0"
description = "Sourcing et suivi de prospects"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "playwright>=1.64.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prospection"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not e2e'"
markers = ["e2e: parcours dans un vrai navigateur, sur l'image construite"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["src/prospection"]

[tool.importlinter]
root_package = "prospection"

[[tool.importlinter.contracts]]
name = "Couches"
type = "layers"
layers = [
    "prospection.ui",
    "prospection.application",
    "prospection.crm | prospection.sources | prospection.storage",
    "prospection.domain",
]

[[tool.importlinter.contracts]]
name = "CRM, sources et stockage indépendants"
type = "independence"
modules = ["prospection.crm", "prospection.sources", "prospection.storage"]
