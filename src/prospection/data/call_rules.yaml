# Fiche « Pour l'appel » (C110, C111) : règles fixes, sans IA. Vous pouvez en ajouter.
# Une règle = conditions (toutes vraies) -> une accroche et/ou des douleurs probables.
# La règle de plus haute priorité donne l'accroche ; 3 douleurs au plus, par priorité.
# Variables possibles : {nom}, {métier}, {ville}, {ancienneté}, {note}.
# Conditions : has_site, found_site, site_score_max, no_form, no_https, not_mobile,
# seo_missing, reviews_max, reviews_min, rating_max, created_within_days, no_hours.
# Formulez des indices, jamais des certitudes : ils se confirment pendant l'appel.
rules:
  - id: sans_site
    priority: 100
    when: {has_site: false}
    hook: "{nom} n'a pas de site : les clients de {ville} qui cherchent un {métier} sur Google tombent peut-être d'abord sur vos concurrents."
    pains:
      - "Sans site, un client qui compare avant d'appeler a du mal à vous faire confiance"
      - "Les demandes arrivent seulement par téléphone, pas le soir ni le week-end"
  - id: creation_recente
    priority: 90
    when: {created_within_days: 365}
    hook: "Vous avez lancé {nom} il y a {ancienneté} : c'est souvent le moment où les premiers clients se gagnent en ligne."
    pains:
      - "Activité récente : peu de bouche-à-oreille, il faut se faire connaître vite"
  - id: pas_mobile
    priority: 80
    when: {not_mobile: true}
    hook: "Votre site s'affiche mal sur téléphone, alors que la plupart des clients cherchent un {métier} depuis leur mobile."
    pains:
      - "Site pas adapté au mobile : des visiteurs repartent peut-être sans appeler"
  - id: site_faible
    priority: 75
    when: {site_score_max: 59}
    hook: "J'ai regardé le site de {nom} : quelques points simples freinent sans doute les demandes."
    pains:
      - "Site vieillissant ou incomplet : une image moins pro que celle des concurrents"
  - id: sans_formulaire
    priority: 70
    when: {no_form: true}
    pains:
      - "Pas de formulaire : un client pressé ne peut pas laisser sa demande"
  - id: sans_https
    priority: 60
    when: {no_https: true}
    pains:
      - "Site sans HTTPS : le navigateur affiche « non sécurisé », ça peut faire fuir"
  - id: seo_local
    priority: 50
    when: {seo_missing: true}
    pains:
      - "Le métier ou la ville manquent dans le titre du site : moins visible à {ville}"
  - id: peu_avis
    priority: 40
    when: {reviews_max: 9}
    pains:
      - "Peu d'avis Google : moins rassurant que des concurrents mieux notés"
  - id: site_hors_fiche
    priority: 30
    when: {found_site: true}
    pains:
      - "Le site n'est pas relié à la fiche Google : des clients ne le trouvent pas"
  - id: sans_horaires
    priority: 20
    when: {no_hours: true}
    pains:
      - "Horaires absents de la fiche Google : des clients hésitent à appeler"
