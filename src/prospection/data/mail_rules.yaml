# Règles du mail d'audit (C145). Fichier modifiable : chaque point = un problème du site, son
# effet sur le business du prospect, puis ce qu'il faudrait faire. Chiffres en fourchette.
#
# Variables possibles dans les textes : {entreprise}, {site}, {expediteur}, {telephone},
# {portfolio}, {calendly}, {nombre}. Un texte mal formé empêche l'app de démarrer (avec un
# message qui dit quoi corriger).
#
# Mise en forme : **texte** en gras ; une ligne qui commence par « - » devient une puce.
#
# points.<code> : le code vient de l'audit (no_https, no_form…). « titre » : court, en gras ;
# « poids » : importance de base ;
# « rang » (C172) : legal, clients (référencement compris), suivi ou autre ; le mail prend les
# points dans cet ordre de rangs, puis du plus lourd au plus léger dans un même rang ;
# « groupe » : deux points du même groupe ne sont jamais cités ensemble (le plus fort reste).
# secteurs.<nom> : « mots » du métier (sans accents, début de mot) ; « bonus » ajouté au poids ;
# « impacts » remplace l'effet business pour ce métier.

# Objets (C162) : l'app les fait tourner, le moins utilisé d'abord ; la page Stats dit lequel
# amène le plus de conversations. Ajoutez-en, retirez-en : au moins un.
objets:
  - "{entreprise} : audit express de votre site, {nombre} à corriger"
  - "J'ai regardé le site de {entreprise} : {nombre} à corriger"
  - "{entreprise} : ce qui vous fait perdre des clients en ligne"
# Objets pour un prospect sans site (C161) : jamais « votre site ».
objets_sans_site:
  - "{entreprise} : {nombre} à corriger pour gagner des clients en ligne"
  - "{entreprise} : ce qui vous fait perdre des clients en ligne"
salutation: "Bonjour,"
intro: "Je suis {expediteur}, développeur web. J'ai regardé votre site ({site}) : **{nombre} à corriger** pour ne plus perdre de clients."
intro_sans_site: "Je suis {expediteur}, développeur web. J'ai regardé la présence en ligne de {entreprise} : **{nombre} à corriger** pour ne plus perdre de clients."
# Libellés des trois parties de chaque point (en gras dans le mail).
constat: "Constat"
cout: "Impact"
solution: "Solution"
portfolio: "Mes réalisations : {portfolio}"
appel_telephone: "**Pour plus d'infos, appelez-moi au {telephone}** : je vous explique tout, c'est gratuit et sans engagement."
appel_sans_telephone: "**Pour plus d'infos, répondez simplement à ce mail** : je vous explique tout, c'est gratuit et sans engagement."
calendly: "Vous préférez choisir un créneau ? {calendly}"
signature: |-
  Bonne journée,
  {expediteur}
pied_desinscription: "Vous ne souhaitez plus recevoir de mail de ma part ? Un clic suffit : {lien}"

points:
  no_https:
    titre: "Un site marqué « Non sécurisé »"
    poids: 15
    rang: clients
    groupe: https
    probleme: "Votre site n'est pas en HTTPS."
    impact: "Les navigateurs l'affichent « Non sécurisé » : entre 60 et 80 % des visiteurs font demi-tour."
    action: "Un certificat, souvent gratuit chez l'hébergeur."
  https_broken:
    titre: "Un avertissement de sécurité dès l'ouverture"
    poids: 15
    rang: clients
    groupe: https
    probleme: "Votre certificat HTTPS est absent ou invalide."
    impact: "Un avertissement de sécurité s'affiche : la plupart des visiteurs repartent."
    action: "Installer ou renouveler le certificat."
  no_mobile:
    titre: "Un site difficile à lire sur téléphone"
    poids: 15
    rang: clients
    probleme: "Votre site n'est pas adapté aux téléphones."
    impact: "Entre 55 et 70 % des visites se font sur mobile : beaucoup partent chez un concurrent."
    action: "Une mise en page qui s'adapte à l'écran."
  slow_mobile:
    titre: "Un site trop lent sur mobile"
    poids: 12
    rang: clients
    groupe: vitesse
    probleme: "Votre site est lent sur téléphone (mesure de Google)."
    impact: "Entre 50 et 60 % des visiteurs mobiles partent au-delà de 3 secondes."
    action: "Alléger les images et le code."
  slow:
    titre: "Un site lent à s'afficher"
    poids: 10
    rang: clients
    groupe: vitesse
    probleme: "Votre site met du temps à s'afficher."
    impact: "Au-delà de 3 secondes, entre 40 et 60 % des visiteurs abandonnent."
    action: "Alléger les images et le code."
  no_form:
    titre: "Aucun moyen simple de vous écrire"
    poids: 15
    rang: clients
    groupe: formulaire
    probleme: "Aucun formulaire de contact sur votre site."
    impact: "Entre 30 et 50 % des clients préfèrent écrire, souvent le soir : ces demandes partent ailleurs."
    action: "Un formulaire simple, visible dès l'accueil."
  form_contact_only:
    titre: "Un formulaire caché sur la page Contact"
    poids: 7
    rang: clients
    groupe: formulaire
    probleme: "Votre formulaire n'est que sur la page Contact."
    impact: "Un visiteur pressé ne le voit pas depuis l'accueil."
    action: "Un bouton « Demander un devis » visible dès l'arrivée."
  quote_incomplete:
    titre: "Une demande de devis qui oublie l'essentiel"
    poids: 6
    rang: clients
    groupe: formulaire
    probleme: "Votre formulaire ne pose pas les questions utiles pour chiffrer une première estimation."
    impact: "Vous rappelez le client pour avoir les infos : le temps de le joindre, un autre a déjà répondu."
    action: "Les bonnes questions du métier : le client décrit son besoin, vous chiffrez tout de suite."
  form_basic:
    titre: "Un formulaire qui ne pose aucune question"
    poids: 6
    rang: clients
    groupe: formulaire
    probleme: "Votre formulaire demande seulement nom, email et message."
    impact: "Vous devez rappeler chaque client pour comprendre son besoin."
    action: "Quelques questions du métier (travaux, surface, photos)."
  form_buried:
    titre: "Un formulaire tout en bas de la page Contact"
    poids: 8
    rang: clients
    groupe: formulaire
    probleme: "Votre formulaire est tout en bas de la page Contact."
    impact: "Il faut le chercher : beaucoup de visiteurs abandonnent avant."
    action: "Le placer en haut de la page, ou dès l'accueil."
  no_cta_top:
    titre: "Pas de bouton « Devis » en haut du site"
    poids: 7
    rang: clients
    probleme: "Aucun bouton « Devis » ou « Rendez-vous » n'est visible en haut de l'accueil."
    impact: "Le visiteur doit chercher comment vous contacter : une partie abandonne."
    action: "Un bouton bien visible dès l'arrivée."
  form_too_long:
    titre: "Un formulaire trop long"
    poids: 5
    rang: clients
    groupe: formulaire
    probleme: "Votre formulaire demande trop de champs obligatoires."
    impact: "Chaque champ en plus fait abandonner une partie des visiteurs."
    action: "Garder l'essentiel obligatoire, le reste facultatif."
  form_no_consent:
    titre: "Un formulaire sans mention RGPD"
    poids: 7
    rang: legal
    probleme: "Votre formulaire ne dit pas ce que deviennent les données envoyées."
    impact: "Le RGPD l'impose : la CNIL peut sanctionner."
    action: "Une phrase et un lien vers votre politique de confidentialité."
  phone_not_clickable:
    titre: "Un numéro qu'on ne peut pas appeler d'un geste"
    poids: 6
    rang: clients
    probleme: "Votre numéro n'est pas cliquable sur téléphone."
    impact: "Obligé de le recopier, une partie des clients abandonne."
    action: "Le rendre cliquable : quelques minutes."
  no_booking:
    titre: "Pas de réservation en ligne"
    poids: 10
    rang: clients
    probleme: "Pas de réservation en ligne."
    impact: "Entre 40 et 60 % des réservations se font hors des heures d'ouverture."
    action: "Un module de réservation relié à votre agenda."
  # Simulateurs (C165) : un seul par mail ; règles dans simulateurs.yaml. Une aide n'est
  # nommée que si le site du prospect en parle.
  sim_borne:
    titre: "Aucun calcul de l'aide pour la borne"
    poids: 9
    rang: clients
    groupe: simulateur
    probleme: "Vous parlez de l'aide pour la borne de recharge, mais le client ne peut pas estimer la sienne."
    impact: "Le client voit le prix plein, pas son coût réel : il compare ailleurs."
    action: "Un simulateur : le client décrit son cas, il voit l'aide possible et le prix final."
  sim_adapt:
    titre: "Aucun calcul de MaPrimeAdapt'"
    poids: 9
    rang: clients
    groupe: simulateur
    probleme: "Vous parlez de MaPrimeAdapt', mais le client ne peut pas estimer son aide."
    impact: "Une personne âgée ou ses enfants hésitent sans savoir ce qui restera à payer."
    action: "Un simulateur : quelques questions, l'aide estimée et le reste à charge."
  sim_renov:
    titre: "Aucun calcul des aides à la rénovation"
    poids: 9
    rang: clients
    groupe: simulateur
    probleme: "Vous citez les aides (MaPrimeRénov', primes énergie), mais le client ne peut pas estimer les siennes."
    impact: "Sans montant, le projet semble trop cher : le client attend ou va chez celui qui chiffre."
