  sim_sap:
    titre: "Le crédit d'impôt n'est pas chiffré"
    poids: 9
    rang: clients
    groupe: simulateur
    probleme: "Vous proposez des services à la personne, mais votre site ne calcule pas le prix après crédit d'impôt."
    impact: "Le client voit le prix plein et oublie qu'il peut en récupérer jusqu'à la moitié."
    action: "Un simulateur : le client entre le montant, il voit tout de suite son prix réel."
