secteurs:
  sante:
    mots: [medecin, dentist, kine, osteopath, infirmi, psycholog, podolog, orthophon, sophrolog, naturopath, dieteticien, pharmac, opticien, audioprothes, sage femme, veterinaire, therapeut]
    bonus: {no_privacy_policy: 12, no_cookie_consent: 8, no_https: 8, https_broken: 8, no_legal_notice: 5, no_booking: 4}
    impacts:
      no_privacy_policy: "Vos patients vous confient des données de santé, dites sensibles : la CNIL y est très attentive."
      no_https: "« Non sécurisé » s'affiche : vos patients hésitent à vous écrire."
  droit_chiffres:
    mots: [avocat, notaire, expert comptable, comptable, huissier, commissaire de justice, assurance, courtier, conseiller financier, gestion de patrimoine, agence immobili, immobilier, mandataire]
    bonus: {no_privacy_policy: 10, no_https: 10, https_broken: 10, no_legal_notice: 8, no_cookie_consent: 6}
    impacts:
      no_https: "« Non sécurisé » s'affiche : pour un métier de confiance, c'est un mauvais signal."
  accueil:
    mots: [restaurant, brasserie, bistrot, pizzeria, creperie, traiteur, coiff, barbier, esthetic, beaute, onglerie, institut, spa, massage, hotel, gite, chambre d hote, salle de sport, fitness, yoga, pilates, coach, tatou, toilett]
    bonus: {no_mobile: 10, slow_mobile: 8, slow: 5, no_booking: 10, phone_not_clickable: 5}
    impacts:
      no_mobile: "Vos clients vous cherchent « près de moi » sur leur téléphone, juste avant de venir."
  urgence:
    mots: [plombier, chauffagiste, chauffage, electricien, serrurier, couvreur, toiture, vitrier, depann, macon, menuisier, peintre, carreleur, plaquiste, renovation, climatisation, desembouage, isolation, debouchage, assainissement, artisan]
    bonus: {no_form: 8, form_contact_only: 10, form_basic: 6, phone_not_clickable: 10, no_mobile: 8, slow_mobile: 5}
    impacts:
      form_basic: "Vous rappelez chaque client pour savoir de quoi il a besoin."
      form_contact_only: "En cas de fuite ou de panne, le client contacte le premier qu'il peut joindre."
      phone_not_clickable: "En urgence, s'il doit recopier votre numéro, il appelle un concurrent."

# Accroches (C160) : première phrase du mail, la première qui s'applique l'emporte. Critères
# possibles : note_min, avis_min, avec_site (vrai/faux), age_max_mois, age_min_ans, label
# (est_rge, est_qualiopi…), secteur (nom d'un secteur ci-dessus). Variables : {note}, {avis},
# {ans}, {entreprise}.
accroches:
  - quand: {note_min: 4.5, avis_min: 10, avec_site: true}
    texte: "{note} ★ sur {avis} avis Google : vos clients sont ravis, votre site doit le montrer."
  - quand: {note_min: 4.5, avis_min: 10, avec_site: false}
    texte: "{note} ★ sur {avis} avis Google : vos clients sont ravis, un site les ferait venir encore plus."
  - quand: {age_max_mois: 12}
    texte: "Félicitations pour le lancement de {entreprise} !"
  - quand: {label: est_rge, secteur: urgence}
    texte: "Vous êtes certifié RGE : c'est un argument fort pour vos clients, à mettre en avant en ligne."
  - quand: {label: est_qualiopi, avec_site: true}
    texte: "Vous êtes certifié Qualiopi : un gage de sérieux que votre site doit montrer."
  - quand: {label: est_patrimoine_vivant}
    texte: "Entreprise du patrimoine vivant : un savoir-faire rare, à montrer en ligne."
  - quand: {note_min: 4.3, avis_min: 20, secteur: accueil, avec_site: true}
    texte: "Vos clients vous notent {note}/5 : votre site doit donner la même envie de venir."
  - quand: {avis_min: 50}
    texte: "Plus de {avis} avis Google : vous avez une vraie réputation à faire valoir en ligne."
  - quand: {age_min_ans: 20, avec_site: true}
    texte: "{ans} ans d'activité : une expérience que votre site doit montrer."

# Accroches tirées de l'audit (C171) : première phrase du mail, liée au premier point cité.
# Phrase choc, 10 mots au plus (l'app refuse de démarrer sinon), sans dénigrer le travail
# déjà fait. Plusieurs phrases par point : elles tournent (la moins utilisée d'abord) et la
# page Stats dit laquelle fait répondre. Écrites normalement : l'app les met en majuscules
# tant que « accroche_majuscules » est vrai. Sans phrase pour le premier point, les
# accroches ci-dessus (avis, ancienneté, labels) restent.
accroche_majuscules: true
accroches_audit:
  no_legal_notice:
    - "Mentions légales absentes : jusqu'à 75 000 € d'amende."
    - "Sans mentions légales, votre site risque une lourde amende."
  no_privacy_policy:
    - "Vous collectez des données sans politique de confidentialité."
  no_cookie_consent:
    - "Vos cookies se déposent sans accord : la CNIL sanctionne."
  form_no_consent:
    - "Votre formulaire collecte des données sans accord RGPD."
  no_form:
    - "Le soir, vos clients ne peuvent pas vous écrire."
  form_contact_only:
    - "Formulaire caché : vos clients pressés ne le trouvent pas."
  form_basic:
    - "Votre formulaire ne dit pas ce que veut le client."
  quote_incomplete:
    - "Votre demande de devis oublie les questions qui font chiffrer."
  form_buried:
    - "Votre formulaire est tout en bas : peu le voient."
  no_cta_top:
    - "Aucun bouton « Devis » visible en arrivant sur votre site."
  no_https:
    - "Vos visiteurs voient « Non sécurisé » en arrivant."
  https_broken:
    - "Une alerte de sécurité accueille vos visiteurs : ils repartent."
  no_mobile:
    - "Sur téléphone, votre site est difficile à lire."
  slow_mobile:
    - "Sur mobile, vos visiteurs partent avant l'affichage."
  slow:
    - "Votre site est lent : chaque seconde coûte des clients."
  no_booking:
    - "Vos clients ne peuvent pas réserver le soir, en ligne."
  phone_not_clickable:
    - "Sur mobile, votre numéro ne s'appelle pas d'un geste."
  thin_content:
    - "Google comprend mal votre métier : vous sortez peu."
  noindex:
    - "Votre site est invisible sur Google : réglage à corriger."
  no_title:
    - "Votre site n'a pas de titre pour Google."
  no_description:
    - "Google n'affiche aucune description de votre activité."
  low_authority:
    - "Google fait peu confiance à votre site."
  js_only:
    - "Google voit une page vide au lieu de votre site."
  no_tracking:
    - "Combien de clients vous amène votre site ? Mystère."
  legacy_ga:
    - "Votre outil de statistiques ne mesure plus rien depuis 2023."
  sim_sap:
    - "Vos clients ne voient pas leur prix après crédit d'impôt."
  no_site:
    - "Sans site, vos clients trouvent d'abord vos concurrents."
