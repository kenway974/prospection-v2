# Règles du mail d'audit (C145). Fichier modifiable : chaque point = un problème du site, son
# effet sur le business du prospect, puis ce qu'il faudrait faire. Chiffres en fourchette.
#
# Variables possibles dans les textes : {entreprise}, {site}, {expediteur}, {telephone},
# {portfolio}, {calendly}, {nombre}. Un texte mal formé empêche l'app de démarrer (avec un
# message qui dit quoi corriger).
#
# Mise en forme : **texte** en gras ; une ligne qui commence par « - » devient une puce.
#
# points.<code> : le code vient de l'audit (no_https, no_form…). « titre » : court, en gras ;
# « poids » : importance de base ;
# « groupe » : deux points du même groupe ne sont jamais cités ensemble (le plus fort reste).
# secteurs.<nom> : « mots » du métier (sans accents, début de mot) ; « bonus » ajouté au poids ;
# « impacts » remplace l'effet business pour ce métier.

objet: "{entreprise} : audit express de votre site, {nombre} à corriger"
# Autres objets possibles : « J'ai regardé le site de {entreprise} : {nombre} à corriger »,
# « {entreprise} : ce que votre site vous fait perdre ({nombre}) ».
intro: |-
  Bonjour,

  Je suis {expediteur}, développeur web. J'ai regardé votre site ({site}) : **{nombre} à corriger** pour ne plus perdre de clients.
# Libellés des trois parties de chaque point (en gras dans le mail).
constat: "Constat"
cout: "Impact"
solution: "Solution"
portfolio: "Mes réalisations : {portfolio}"
appel_telephone: "**Pour plus d'infos, appelez-moi au {telephone}** : je vous explique tout, c'est gratuit et sans engagement."
appel_sans_telephone: "**Pour plus d'infos, répondez simplement à ce mail** : je vous explique tout, c'est gratuit et sans engagement."
calendly: "Vous préférez choisir un créneau ? {calendly}"
signature: |-
  Bonne journée,
  {expediteur}
pied_desinscription: "Vous ne souhaitez plus recevoir de mail de ma part ? Un clic suffit : {lien}"

points:
  no_https:
    titre: "Un site marqué « Non sécurisé »"
    poids: 15
    groupe: https
    probleme: "Votre site n'est pas en HTTPS."
    impact: "Les navigateurs l'affichent « Non sécurisé » : entre 60 et 80 % des visiteurs font demi-tour."
    action: "Un certificat, souvent gratuit chez l'hébergeur."
  https_broken:
    titre: "Un avertissement de sécurité dès l'ouverture"
    poids: 15
    groupe: https
    probleme: "Votre certificat HTTPS est absent ou invalide."
    impact: "Un avertissement de sécurité s'affiche : la plupart des visiteurs repartent."
    action: "Installer ou renouveler le certificat."
  no_mobile:
    titre: "Un site difficile à lire sur téléphone"
    poids: 15
    probleme: "Votre site n'est pas adapté aux téléphones."
    impact: "Entre 55 et 70 % des visites se font sur mobile : beaucoup partent chez un concurrent."
    action: "Une mise en page qui s'adapte à l'écran."
  slow_mobile:
    titre: "Un site trop lent sur mobile"
    poids: 12
    groupe: vitesse
    probleme: "Votre site est lent sur téléphone (mesure de Google)."
    impact: "Entre 50 et 60 % des visiteurs mobiles partent au-delà de 3 secondes."
    action: "Alléger les images et le code."
  slow:
    titre: "Un site lent à s'afficher"
    poids: 10
    groupe: vitesse
    probleme: "Votre site met du temps à s'afficher."
    impact: "Au-delà de 3 secondes, entre 40 et 60 % des visiteurs abandonnent."
    action: "Alléger les images et le code."
  no_form:
    titre: "Aucun moyen simple de vous écrire"
    poids: 15
    groupe: formulaire
    probleme: "Aucun formulaire de contact sur votre site."
    impact: "Entre 30 et 50 % des clients préfèrent écrire, souvent le soir : ces demandes partent ailleurs."
    action: "Un formulaire simple, visible dès l'accueil."
  form_contact_only:
    titre: "Un formulaire caché sur la page Contact"
    poids: 7
    groupe: formulaire
    probleme: "Votre formulaire n'est que sur la page Contact."
    impact: "Un visiteur pressé ne le voit pas depuis l'accueil."
    action: "Un bouton « Demander un devis » visible dès l'arrivée."
  form_basic:
    titre: "Un formulaire qui ne pose aucune question"
    poids: 6
    groupe: formulaire
    probleme: "Votre formulaire demande seulement nom, email et message."
    impact: "Vous devez rappeler chaque client pour comprendre son besoin."
    action: "Quelques questions du métier (travaux, surface, photos)."
  phone_not_clickable:
    titre: "Un numéro qu'on ne peut pas appeler d'un geste"
    poids: 6
    probleme: "Votre numéro n'est pas cliquable sur téléphone."
    impact: "Obligé de le recopier, une partie des clients abandonne."
    action: "Le rendre cliquable : quelques minutes."
  no_booking:
    titre: "Pas de réservation en ligne"
    poids: 10
    probleme: "Pas de réservation en ligne."
    impact: "Entre 40 et 60 % des réservations se font hors des heures d'ouverture."
    action: "Un module de réservation relié à votre agenda."
  noindex:
    titre: "Un site invisible sur Google"
    poids: 15
    probleme: "Votre site est caché aux moteurs de recherche."
    impact: "Il n'apparaît pas sur Google."
    action: "Retirer ce réglage, souvent oublié."
  low_authority:
    titre: "Un site que Google connaît à peine"
    poids: 8
    probleme: "Google connaît encore peu votre site."
    impact: "Vos concurrents sortent avant vous dans les recherches."
    action: "Des pages sur vos services et votre ville."
  no_title:
    titre: "Pas de titre dans les résultats Google"
    poids: 8
    groupe: google
    probleme: "Votre site n'a pas de titre pour Google."
    impact: "Google affiche un texte au hasard : moins de clics."
    action: "Un titre avec votre métier et votre ville."
  no_description:
    titre: "Une présentation au hasard dans Google"
    poids: 4
    groupe: google
    probleme: "Pas de description pour Google."
    impact: "Un extrait au hasard au lieu d'un texte qui donne envie."
    action: "Deux phrases sur ce que vous faites et où."
  thin_content:
    titre: "Trop peu de texte pour être trouvé"
    poids: 6
    probleme: "Votre site contient très peu de texte."
    impact: "Google comprend mal ce que vous faites : vous sortez peu."
    action: "Une page par service, avec votre ville."
  outdated:
    titre: "Un site qui semble abandonné"
    poids: 7
    probleme: "Votre site semble ne plus être mis à jour."
    impact: "Un site qui paraît abandonné fait douter les clients."
    action: "Un rafraîchissement du contenu et du design."
  legacy_ga:
    titre: "Des statistiques arrêtées depuis 2023"
    poids: 6
    groupe: suivi
    probleme: "Vos statistiques utilisent l'ancien Google Analytics, arrêté en 2023."
    impact: "Vous ne savez plus combien de clients vous trouvent en ligne."
    action: "Passer à la nouvelle version."
  no_tracking:
    titre: "Aucune statistique de visite"
    poids: 4
    groupe: suivi
    probleme: "Aucun outil de statistiques sur votre site."
    impact: "Impossible de savoir s'il vous rapporte des clients."
    action: "Un outil simple et conforme au RGPD."
  old_wordpress:
    titre: "Un WordPress qui n'est plus à jour"
    poids: 9
    groupe: maintenance
    probleme: "Votre WordPress n'est plus à jour."
    impact: "Des failles connues : risque de piratage."
    action: "Une mise à jour et des sauvegardes."
  old_php:
    titre: "Un serveur sans correctifs de sécurité"
    poids: 9
    groupe: maintenance
    probleme: "Votre serveur utilise une version de PHP sans correctifs de sécurité."
    impact: "Le site devient une cible facile pour les pirates."
    action: "Mettre le serveur à jour."
  mixed_content:
    titre: "Des éléments chargés sans sécurité"
    poids: 6
    probleme: "Des éléments de votre site sont chargés sans sécurité."
    impact: "Le cadenas peut disparaître et faire fuir des visiteurs."
    action: "Corriger l'adresse de ces fichiers."
  js_only:
    titre: "Un site que Google lit mal"
    poids: 8
    probleme: "Votre site s'affiche entièrement par JavaScript."
    impact: "Google le lit mal, et les assistants IA n'y voient rien."
    action: "Générer les pages côté serveur."
  no_legal_notice:
    titre: "Pas de mentions légales"
    poids: 9
    probleme: "Pas de mentions légales sur votre site."
    impact: "Obligatoires : jusqu'à 75 000 € d'amende (375 000 € pour une société)."
    action: "Une page de mentions légales, vite rédigée."
  no_privacy_policy:
    titre: "Pas de politique de confidentialité"
    poids: 9
    probleme: "Pas de politique de confidentialité."
    impact: "Votre site recueille des données : le RGPD l'impose, la CNIL peut sanctionner."
    action: "Une page claire, liée au formulaire."
  no_cookie_consent:
    titre: "Des cookies déposés sans accord"
    poids: 9
    probleme: "Des traceurs sont déposés sans l'accord des visiteurs."
    impact: "La CNIL sanctionne les cookies sans consentement."
    action: "Un bandeau de consentement conforme."

secteurs:
  sante:
    mots: [medecin, dentist, kine, osteopath, infirmi, psycholog, podolog, orthophon, sophrolog, naturopath, dieteticien, pharmac, opticien, audioprothes, sage femme, veterinaire, therapeut]
    bonus: {no_privacy_policy: 12, no_cookie_consent: 8, no_https: 8, https_broken: 8, no_legal_notice: 5, no_booking: 4}
    impacts:
      no_privacy_policy: "Vos patients vous confient des données de santé, dites sensibles : la CNIL y est très attentive."
      no_https: "« Non sécurisé » s'affiche : vos patients hésitent à vous écrire."
  droit_chiffres:
    mots: [avocat, notaire, expert comptable, comptable, huissier, commissaire de justice, assurance, courtier, conseiller financier, gestion de patrimoine, agence immobili, immobilier, mandataire]
    bonus: {no_privacy_policy: 10, no_https: 10, https_broken: 10, no_legal_notice: 8, no_cookie_consent: 6}
    impacts:
      no_https: "« Non sécurisé » s'affiche : pour un métier de confiance, c'est un mauvais signal."
  accueil:
    mots: [restaurant, brasserie, bistrot, pizzeria, creperie, traiteur, coiff, barbier, esthetic, beaute, onglerie, institut, spa, massage, hotel, gite, chambre d hote, salle de sport, fitness, yoga, pilates, coach, tatou, toilett]
    bonus: {no_mobile: 10, slow_mobile: 8, slow: 5, no_booking: 10, phone_not_clickable: 5}
    impacts:
      no_mobile: "Vos clients vous cherchent « près de moi » sur leur téléphone, juste avant de venir."
  urgence:
    mots: [plombier, chauffagiste, chauffage, electricien, serrurier, couvreur, toiture, vitrier, depann, macon, menuisier, peintre, carreleur, plaquiste, renovation, climatisation, desembouage, isolation, debouchage, assainissement, artisan]
    bonus: {no_form: 8, form_contact_only: 10, form_basic: 6, phone_not_clickable: 10, no_mobile: 8, slow_mobile: 5}
    impacts:
      form_basic: "Vous rappelez chaque client pour savoir de quoi il a besoin."
      form_contact_only: "En cas de fuite ou de panne, le client contacte le premier qu'il peut joindre."
      phone_not_clickable: "En urgence, s'il doit recopier votre numéro, il appelle un concurrent."
