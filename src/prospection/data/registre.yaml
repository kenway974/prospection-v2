# Libellés du registre des entreprises (INSEE). Un code absent s'affiche « autre forme (code …) ».
formes:
  "1000": Entrepreneur individuel
  "5410": SARL
  "5498": EURL
  "5499": SARL
  "5599": SA
  "5710": SAS
  "5720": SASU
  "6540": SCI
  "9220": Association
effectifs:
  NN: non employeuse ou effectif non déclaré
  "00": aucun salarié
  "01": 1 ou 2 salariés
  "02": 3 à 5 salariés
  "03": 6 à 9 salariés
  "11": 10 à 19 salariés
  "12": 20 à 49 salariés
  "21": 50 à 99 salariés
  "22": 100 à 199 salariés
  "31": 200 à 249 salariés
  "32": 250 à 499 salariés
  "41": 500 à 999 salariés
  "42": 1 000 à 1 999 salariés
  "51": 2 000 à 4 999 salariés
  "52": 5 000 à 9 999 salariés
  "53": 10 000 salariés et plus
