  est_patrimoine_vivant: "Entreprise du patrimoine vivant"
  est_societe_mission: "Société à mission"
  est_organisme_formation: "Organisme de formation"
  est_entrepreneur_spectacle: "Entrepreneur de spectacles"
  est_finess: "Établissement sanitaire ou social (FINESS)"
  est_siae: "Structure d'insertion par l'activité économique"
  est_alim_confiance: "Contrôle sanitaire Alim'Confiance"
  est_achats_responsables: "Label Relations fournisseurs et achats responsables"
