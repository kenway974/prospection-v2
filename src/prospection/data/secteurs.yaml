# Secteurs (C132) : un choix remplit le champ « Métiers » avec tous ses mots-clés,
# modifiables avant de lancer. 10 mots-clés au plus par secteur (limite du formulaire).
# Source : prospection-bot/target_segments.py (version 530ba12), relu : mots trop vagues
# retirés (« luxe », « artisan », « PME »…), secteurs sans vitrine Google Maps écartés
# (startups, éditeurs SaaS, e-commerçants), chaînes (contrôle technique, centres auto) et
# mots qui ramènent surtout des particuliers (RGPD : garde d'enfants, cours particuliers,
# aide à domicile, locations saisonnières).
- label: Artisans & BTP
  sectors:
    - id: btp
      label: Artisans du bâtiment (tous corps)
      keywords: [maçon, carreleur, peintre en bâtiment, plâtrier, menuisier, couvreur, charpentier, plaquiste, façadier, vitrier]
    - id: plombiers_electriciens
      label: Plombiers, électriciens, serruriers
      keywords: [plombier, électricien, serrurier, plomberie chauffage, électricité générale, dépannage plomberie]
    - id: cvc
      label: Chauffage, climatisation
      keywords: [chauffagiste, climatisation, pompe à chaleur, installateur climatisation, entreprise de chauffage, frigoriste]
    - id: energies
      label: Énergies renouvelables, isolation
      keywords: [installateur photovoltaïque, panneaux solaires, isolation des combles, isolation thermique, borne de recharge électrique]
    - id: garages
      label: Garages, carrosseries
      keywords: [garage automobile, carrosserie, mécanique auto, réparation automobile, garage indépendant]
