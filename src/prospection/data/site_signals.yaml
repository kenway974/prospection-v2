# Signatures repérées dans l'adresse d'un site ou celles des ressources qu'il charge (repris de prospection-bot,
# services/analyzer.py, version 530ba12). Tout en minuscules.
technologies:
  Base44: ["base44.app", "base44.com"]
  Lovable: ["lovable.app", "lovable.dev", "gptengineer"]
  WordPress: ["wp-content/", "wp-includes/"]
  Wix: ["wixstatic.com", "wixsite.com", "wix.com"]
  Squarespace: ["squarespace.com", "squarespace-cdn.com"]
  Shopify: ["cdn.shopify.com", "myshopify.com"]
  PrestaShop: ["prestashop", "/modules/ps_"]
  Joomla: ["/components/com_", "/media/jui/"]
  Drupal: ["sites/default/files", "/core/misc/drupal"]
  Webflow: ["webflow.io", "webflow.com"]
  Jimdo: ["jimdo.com", "jimdofree.com", "jimdosite.com"]
  Weebly: ["weebly.com", "editmysite.com"]
  Webnode: ["webnode.fr", "webnode.com"]
  Site123: ["site123.com", "site123.me"]
tracking: ["googletagmanager.com", "google-analytics.com", "gtag(", "fbq(", "hotjar", "clarity.ms", "matomo", "plausible.io"]
social: ["facebook.com", "instagram.com", "linkedin.com", "tiktok.com", "youtube.com", "x.com", "twitter.com", "pinterest."]
# Services de formulaires intégrés (iframe ou script) : un formulaire de contact existe (C137).
form_services: ["docs.google.com/forms", "forms.gle", "typeform.com", "jotform", "tally.so", "hsforms.net", "hsforms.com", "sibforms.com", "forms.zohopublic", "cognitoforms.com", "formstack.com", "wufoo.com", "123formbuilder", "paperform.co", "fillout.com", "elfsight", "formulaire.io", "framaforms.org"]
# Constructeurs qui dessinent souvent leurs formulaires en JavaScript : sans formulaire vu, « non vérifié » (C138).
form_builders: ["Wix", "Squarespace", "Webflow", "Jimdo", "Weebly", "Webnode", "Site123"]
# Mots d'un lien (adresse ou texte) vers une page de contact, du plus utile au moins utile (C138).
contact_words: ["contact", "devis", "ecrire", "écrire", "rendez-vous", "rdv", "reserv", "réserv", "nous-joindre", "joindre"]
# Traceurs soumis au consentement (CNIL) ; Matomo et Plausible, exemptables, n'y sont pas (C140).
consent_trackers: ["googletagmanager.com", "google-analytics.com", "gtag(", "fbq(", "connect.facebook.net", "hotjar", "clarity.ms", "snap.licdn.com", "analytics.tiktok.com"]
# Outils de recueil du consentement (bandeau cookies) et Consent Mode de Google (C140).
consent_tools: ["tarteaucitron", "axept.io", "axeptio", "cookiebot", "didomi", "onetrust", "cookielaw.org", "complianz", "cookieyes", "cookie-law-info", "iubenda", "quantcast", "sirdata", "borlabs", "usercentrics", "orejime", "klaro", "cookie-notice", "moove_gdpr", "gdpr-cookie-compliance", "consentmanager", "osano", "termly", "cookiefirst", "cookie-script.com", "gtag('consent'", "gtag(\"consent\"", "gtag( 'consent'"]
# Mots d'un lien vers les mentions légales, puis vers la politique de confidentialité (C140).
legal_words: ["mentions-legales", "mentions_legales", "mentionslegales", "mentions légales", "mention légale", "mentions legales", "informations légales", "legal-notice", "impressum"]
privacy_words: ["confidentialit", "donnees-personnelles", "données personnelles", "privacy", "rgpd", "gdpr", "protection-des-donnees", "protection des données", "vie privée", "vie-privee"]
# Réservation en ligne : services connus (C142) et métiers où elle compte (mots du métier, sans accents).
booking_services: ["planity", "calendly", "doctolib", "treatwell", "zenchef", "thefork", "lafourchette", "resengo", "booksy", "simplybook", "setmore", "rdv360", "maiia", "keldoc", "guestonline", "sevenrooms", "fresha", "salonkee", "mindbody", "acuityscheduling", "youcanbook.me", "clicrdv", "timify", "kiute", "bookingkit", "regiondo", "gymlib", "deciplus", "resamania"]
booking_words: ["reserv", "réserv", "rendez-vous", "prendre rdv", "prise de rdv", "booking", "book now"]
booking_trades: ["restaurant", "brasserie", "bistrot", "pizzeria", "creperie", "coiff", "barbier", "esthetic", "beaute", "onglerie", "manucure", "massage", "spa", "kine", "osteopath", "dentist", "medecin", "podolog", "orthophon", "psycholog", "sophrolog", "naturopath", "dieteticien", "coach", "salle de sport", "fitness", "yoga", "pilates", "auto ecole", "garage", "controle technique", "toilett", "veterinaire", "tatou", "photograph", "hotel", "gite", "chambre d hote", "escape game", "karting"]
# Formulaires dessinés en JavaScript : classe CSS exacte du widget laissée dans le HTML (C137).
# Ninja Forms (WordPress), Squarespace, Weebly, Jimdo, Webflow, Wix.
form_widgets: ["nf-form-cont", "sqs-block-form", "wsite-form", "j-formnew", "w-form", "wixui-form"]
# Identifiants d'applications de formulaires présents dans les données de la page (Wix Forms).
form_apps: ["14ce1214-b278-a7e4-1373-00cebd1bef7c"]
# Coquille d'application JavaScript : page presque vide, contenu dessiné dans le navigateur (C152).
# Identifiants de la racine de l'application, vide dans la page reçue.
js_app_roots: ["root", "app", "__next", "__nuxt", "svelte"]
# Pas un vrai site : réseaux sociaux, pages de liens, annuaires (domaine → nom affiché) (C154).
not_sites:
