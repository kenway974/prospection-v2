  twitter.com: X
  pinterest.com: Pinterest
  pinterest.fr: Pinterest
  wa.me: WhatsApp
  pagesjaunes.fr: PagesJaunes
  solocal.com: PagesJaunes
  houzz.fr: Houzz
  houzz.com: Houzz
  starofservice.com: StarOfService
  habitatpresto.com: Habitatpresto
  planity.com: Planity
  treatwell.fr: Treatwell
  doctolib.fr: Doctolib
# Boutons d'action en haut de l'accueil (devis, rendez-vous…) : « Contact » du menu ne compte pas (C158).
cta_words: ["devis", "estimation", "rendez-vous", "rdv", "reserv", "réserv", "appel gratuit", "rappel", "contactez"]
# Questions utiles d'un formulaire selon le métier (C159) : mots du métier (sans accents, début de
