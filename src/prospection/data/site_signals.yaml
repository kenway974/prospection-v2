      type de travaux: [travaux, prestation, intervention, service, besoin, projet, select]
      adresse ou code postal: [adresse, postal, ville, commune, cp]
      photos: [photo, file, image, piece jointe, pièce jointe]
      délai souhaité: [delai, délai, urgence, quand, date]
  paysage:
    mots: [paysag, jardin, elagu, espaces verts, espace vert, arbor, taille de haie]
    champs:
      surface: [surface, superficie, m2, m², metrage, métrage]
      type d'entretien: [prestation, entretien, travaux, service, besoin, select]
