# Textes des SMS envoyés avec le mail d'audit (C177 à C179). Fichier modifiable.
#
# Un SMS tient en 160 caractères de l'alphabet SMS de base : pas de ê, â, ô, î, û, ç ni de
# guillemets typographiques (é, è, à, ù, É sont permis). 20 caractères sont gardés pour la
# mention « STOP au 36… » ajoutée par Brevo : chaque texte rempli fait 140 caractères au
# plus. Un texte trop long, une phrase trop longue ou une variable inconnue empêche l'app de
# démarrer, avec un message qui dit quoi raccourcir.
#
# Variables : {salutation} (« Bonjour Martin Paysage », ou « Bonjour » si le nom ne tient
# pas en entier : jamais un nom coupé), {probleme} (phrase courte du premier point de l'audit,
# ci-dessous), {telephone} (votre numéro, Réglages → Mail d'audit). L'expéditeur s'affiche
# sous votre nom (« Kenny ») et ne peut pas recevoir de réponse : les textes invitent à écrire
# à votre numéro.
textes:
  # Le mail est parti : le SMS annonce les détails dans le mail.
  mail: "{salutation}, j'ai repéré : {probleme}. Détails dans le mail envoyé à l'instant. Kenny, développeur web"
  # Le mail a été refusé : le dirigeant doit le savoir.
  bloque: "{salutation}, j'ai repéré : {probleme}. Mon mail ne vous parvient pas : écrivez-moi au {telephone}. Kenny"
  # Aucune adresse trouvée.
  sans_mail: "{salutation}, j'ai repéré : {probleme}. Je vous explique en 5 min : écrivez-moi au {telephone}. Kenny"
  # Refus repéré après un SMS « mail » (C178) : un second SMS, une seule fois.
  relance_bloque: "{salutation}, mon mail vous a été retourné : votre adresse bloque sans doute aussi vos clients. Écrivez-moi au {telephone}. Kenny"
# Phrase courte par point de l'audit (45 caractères au plus) ; sinon « defaut ».
defaut: "quelques points simples à corriger"
