# Pays proposés et leurs provinces (Belgique) ou cantons (Suisse, Luxembourg).
# Codes : ISO 3166-2 sans le préfixe du pays (BE-WLG → WLG, CH-VD → VD, LU-ME → ME).
# Provinces belges : tranches de codes postaux de bpost, pour écarter ce qui est hors zone.
# Pour chaque pays : nom, « dans » (en Belgique, au Luxembourg…), message d'une zone inconnue,
# exemple valide, et pour la Belgique le nom des régions qui précisent une ville.
pays:
  FR: {nom: France, dans: en France, inconnu: Département inconnu, exemple: "974, Rhône"}
  BE:
    nom: Belgique
    dans: en Belgique
    inconnu: Province inconnue
    exemple: Liège, Hainaut
    regions_des_villes: {BRU: Bruxelles-Capitale, WAL: Wallonie, VLG: Flandre}
  CH: {nom: Suisse, dans: en Suisse, inconnu: Canton inconnu, exemple: "Vaud, Genève"}
  LU: {nom: Luxembourg, dans: au Luxembourg, inconnu: Canton inconnu, exemple: "Mersch, Esch-sur-Alzette"}
  MC: {nom: Monaco, dans: à Monaco}
regions:
