{% set tabs = [
  ("today", "/", "Aujourd'hui", '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
  ("prospects", "/prospects", "Prospects", '<path d="M9 6h12M9 12h12M9 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="2.6"/>'),
  ("field", "/terrain", "Terrain", '<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>'),
  ("search", "/recherche", "Recherche", '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'),
] %}
<nav aria-label="Navigation principale" class="tabbar">
{% for key, href, label, icon in tabs %}<a href="{{ href }}"{% if tab == key %} aria-current="page"{% endif %} class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">{{ icon | safe }}</svg><span>{{ label }}</span></a>
{% endfor %}</nav>
