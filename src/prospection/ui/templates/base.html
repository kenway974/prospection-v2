<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false, "historyCacheSize": 0, "responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "422", "swap": true}, {"code": "[45]..", "swap": false, "error": true}]}'>
<title>{% block title %}Prospection{% endblock %}</title>
<meta name="theme-color" content="#1A3E8F">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx-2.0.11.min.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<main class="page{% if tab is defined %} with-nav{% endif %}">
<p id="erreur-reseau" class="notice save-error" role="alert" hidden data-offline="Pas de connexion : rien n'a été enregistré. Votre saisie est gardée, réessayez." data-server="Le serveur n'a pas enregistré votre saisie : elle est gardée, réessayez dans un instant."></p>
{% block content %}{% endblock %}
</main>
{% if tab is defined %}{% include "_nav.html" %}{% endif %}
</body>
</html>
